services:
  vault-service:
    image: vault-service:latest
    container_name: vault-service
    restart: unless-stopped
    ports:
      - "5599:5599"
    volumes:
      # Mount the master .env and vault.key into the container.
      # These are copied to the NAS by deploy.sh.
      - ./env:/app/env:ro
    environment:
      - VAULT_PORT=5599
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:5599/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
